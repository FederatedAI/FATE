name: Build pyfate
on:
  workflow_dispatch:
    inputs:
      source:
        description: 'source branch'
        required: true
      type:
        description: 'publish type, test or release'
        required: false
        default: 'test'

permissions:
  contents: read

jobs:
  build:
    name: (${{github.event.inputs.type}} build) branch ${{github.event.inputs.source}}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{github.event.inputs.source}}
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - name: Build pyfate
        working-directory: python
        run: |
          python3 setup.py sdist --formats=gztar -d ../dist

      - name: Twine check
        run: |
          pip install -U twine
          twine check dist/*

      - name: Upload to artifact
        uses: actions/upload-artifact@v7
        with:
          path: |
            dist/*

      - name: Test Install
        run: |
          pip install -U pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch==2.13.0+cpu
          pip install dist/*.tar.gz pytest
          pip check
          HF_HUB_OFFLINE=1 python -m pytest -q --import-mode=importlib python/fate/test/test_python_dependency_migration.py

      - name: Upload to PyPI Test
        if: ${{ github.event.inputs.type == 'test' }}
        run: |
          twine upload --repository testpypi dist/* --verbose
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.pypitest_token }}

      - name: Upload to PyPI
        if: ${{ github.event.inputs.type == 'release' }}
        run: |
          twine upload dist/* --verbose
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.pypi_token }}
